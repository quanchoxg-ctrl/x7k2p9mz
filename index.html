<html lang="es">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;background:#0b0b10;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;overscroll-behavior:none;
}
#app{height:100dvh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 6px}

/* ---------- barra superior ---------- */
#topbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;flex-shrink:0;z-index:5}
.tb{
  appearance:none;border:1px solid #2c2c38;background:#16161d;color:#c3c3cf;
  font:600 10.5px/1 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;
  padding:8px 11px;border-radius:7px;cursor:pointer;transition:background .12s,color .12s,opacity .12s;
}
.tb:hover:not(:disabled){background:#22222e;color:#fff}
.tb:active:not(:disabled){transform:translateY(1px)}
.tb:disabled{opacity:.32;cursor:default}
.tb.on{border-color:#c8a63a;color:#f0d875}

#stage{flex:1;display:grid;place-items:center;min-height:0;width:100%;overflow:hidden}

/* ---------- carcasa ---------- */
#gb{
  position:relative;width:360px;height:592px;flex-shrink:0;
  border-radius:14px 14px 68px 14px;
  background:linear-gradient(157deg,#e6e2d8 0%,#d3cec2 42%,#c2bdaf 78%,#b6b1a3 100%);
  box-shadow:
    0 20px 44px rgba(0,0,0,.6),
    0 3px 0 rgba(255,255,255,.06),
    inset 0 2px 1px rgba(255,255,255,.85),
    inset -3px -5px 14px rgba(0,0,0,.16);
  transform-origin:center center;
  will-change:transform;
}

/* pantalla */
#bezel{
  position:absolute;left:28px;top:32px;width:304px;height:270px;
  background:linear-gradient(150deg,#5b5b66 0%,#43434e 45%,#33333c 100%);
  border-radius:10px 10px 46px 10px;
  box-shadow:
    inset 0 2px 2px rgba(255,255,255,.16),
    inset 0 -4px 10px rgba(0,0,0,.55),
    0 1px 0 rgba(255,255,255,.6);
  display:flex;flex-direction:column;align-items:center;
  padding-top:16px;
}
.bezel-label{
  font:600 7.5px/1 system-ui;letter-spacing:1.7px;color:#8f8f9e;
  text-transform:uppercase;margin-bottom:7px;opacity:.9;
}
#lcd{
  display:block;width:240px;height:216px;background:#9bbc0f;
  image-rendering:pixelated;image-rendering:crisp-edges;
  border-radius:3px;
  box-shadow:0 0 0 2px #2a2a32, 0 0 22px rgba(140,180,20,.10), inset 0 0 18px rgba(0,0,0,.25);
}
.bezel-foot{
  display:flex;align-items:center;gap:7px;align-self:flex-start;
  padding-left:16px;margin-top:9px;
  font:600 7px/1 system-ui;letter-spacing:1.5px;color:#8f8f9e;text-transform:uppercase;
}
#led{
  width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff7a72,#c11a1a 62%,#6d0a0a);
  box-shadow:0 0 7px rgba(255,60,50,.75),inset 0 0 2px rgba(0,0,0,.6);
}

/* logo */
#logo{
  position:absolute;left:31px;top:312px;line-height:1;
  color:#3c4066;display:flex;align-items:baseline;gap:5px;
}
#logo .nin{font:600 12px/1 system-ui;letter-spacing:.2px}
#logo .gb{font:800 italic 17px/1 system-ui;letter-spacing:1.1px}
#logo .tm{font:600 6px/1 system-ui;align-self:flex-start;margin-top:2px;opacity:.8}

/* cruceta */
#dpad{position:absolute;left:33px;top:386px;width:108px;height:108px}
.dp{
  position:absolute;width:36px;height:36px;
  background:linear-gradient(170deg,#33333d,#1b1b21 75%);
  box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 3px rgba(0,0,0,.4);
}
.dp.up{left:36px;top:0;border-radius:5px 5px 0 0}
.dp.down{left:36px;bottom:0;border-radius:0 0 5px 5px}
.dp.left{left:0;top:36px;border-radius:5px 0 0 5px}
.dp.right{right:0;top:36px;border-radius:0 5px 5px 0}
.dp-center{
  position:absolute;left:36px;top:36px;width:36px;height:36px;
  background:linear-gradient(170deg,#33333d,#1b1b21 75%);
}
.dp::after{
  content:'';position:absolute;top:50%;left:50%;width:0;height:0;
  border:5px solid transparent;
}
.dp.up::after{transform:translate(-50%,-62%);border-bottom-color:#5c5c6b}
.dp.down::after{transform:translate(-50%,-38%);border-top-color:#5c5c6b}
.dp.left::after{transform:translate(-62%,-50%);border-right-color:#5c5c6b}
.dp.right::after{transform:translate(-38%,-50%);border-left-color:#5c5c6b}
.dp.pressed{background:linear-gradient(170deg,#43434f,#26262e 75%)}

/* A / B */
#ab{position:absolute;right:30px;top:392px;width:146px;height:100px;transform:rotate(-22deg)}
.ab{
  position:absolute;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#cf4d88 0%,#a52763 45%,#7c1750 78%,#61103f 100%);
  color:#f4dbe8;font:800 14px/1 system-ui;
  display:flex;align-items:center;justify-content:center;
  box-shadow:
    0 3px 6px rgba(0,0,0,.5),
    0 1px 0 rgba(255,255,255,.5),
    inset 0 2px 2px rgba(255,255,255,.3),
    inset 0 -4px 8px rgba(0,0,0,.35);
  transition:transform .06s,box-shadow .06s;
}
.ab.a{right:0;top:0}
.ab.b{left:0;bottom:0}
.ab.pressed{transform:scale(.94);box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 3px 6px rgba(0,0,0,.4)}

/* select / start */
#startsel{
  position:absolute;left:126px;top:512px;display:flex;gap:18px;transform:rotate(-22deg);
}
.syswrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.sys{
  width:46px;height:12px;border-radius:7px;
  background:linear-gradient(170deg,#43434e,#282830);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.55);
  transition:background .06s;
}
.sys.pressed{background:linear-gradient(170deg,#2f2f38,#1d1d24)}
.syswrap span{font:600 6.5px/1 system-ui;letter-spacing:1.2px;color:#6f6f7d}

/* altavoz */
#speaker{
  position:absolute;right:24px;bottom:38px;width:92px;height:70px;
  transform:rotate(-32deg);border-radius:5px;
  background:repeating-linear-gradient(90deg,#a9a496 0 5px,#bdb8ab 5px 15px);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.5);
  opacity:.75;
}

/* ---------- portada ---------- */
#overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,#1d2233 0%,#0e1017 45%,#07080c 100%);
  transition:opacity .25s;
}
#overlay.hidden{opacity:0;pointer-events:none}
.poke{
  width:74px;height:74px;border-radius:50%;position:relative;flex-shrink:0;
  background:linear-gradient(180deg,#ff2b2b 0%,#ff2b2b 46%,#101014 46%,#101014 54%,#f5f5f5 54%,#f5f5f5 100%);
  box-shadow:0 8px 22px rgba(255,40,40,.22),inset 0 0 0 3px #101014;
  animation:bob 2.6s ease-in-out infinite;
}
.poke::after{
  content:'';position:absolute;top:50%;left:50%;width:22px;height:22px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:#f5f5f5;box-shadow:inset 0 0 0 4px #101014;
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
#overlay h1{
  font:800 30px/1.1 system-ui;letter-spacing:.02em;
  color:#ffd93b;text-shadow:0 3px 0 #a8790b,0 6px 22px rgba(255,200,0,.22);
}
#ov-sub{font:500 12.5px/1.4 system-ui;color:#8b90a3;letter-spacing:.06em;text-transform:uppercase}
#play{
  margin-top:8px;appearance:none;border:0;cursor:pointer;
  font:800 15px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;
  color:#fff;padding:15px 42px;border-radius:40px;
  background:linear-gradient(180deg,#e0478c,#a3225f);
  box-shadow:0 6px 0 #6d1240,0 12px 24px rgba(200,40,110,.35);
  transition:transform .07s,box-shadow .07s;
}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #6d1240,0 6px 14px rgba(200,40,110,.3)}
#play:disabled{opacity:.6;cursor:wait}
#ov-reset{
  appearance:none;background:none;border:0;cursor:pointer;
  font:500 11.5px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;
  color:#5f6478;text-decoration:underline;text-underline-offset:3px;
}
#ov-reset:hover{color:#9aa0b6}
#ov-status{font:500 11px/1.5 system-ui;color:#6b7086;min-height:16px;max-width:340px}
#ov-status.error{color:#ff6b6b}
#ov-hint{font:500 10.5px/1.5 system-ui;color:#464b5e;margin-top:6px}

/* ---------- aviso ---------- */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);
  background:rgba(24,24,32,.95);border:1px solid #2f2f3d;color:#dcdcea;
  font:600 11.5px/1 system-ui;letter-spacing:.05em;
  padding:11px 18px;border-radius:9px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <button class="tb" id="btn-save" disabled>Guardar</button>
    <button class="tb" id="btn-load" disabled>Cargar</button>
    <button class="tb" id="btn-fs">Pantalla completa</button>
    <button class="tb" id="btn-close" disabled>Cerrar</button>
  </div>

  <div id="stage">
    <div id="gb">
      <div id="bezel">
        <div class="bezel-label">Dot Matrix with Stereo Sound</div>
        <canvas id="lcd" width="160" height="144"></canvas>
        <div class="bezel-foot"><span id="led"></span><span>Battery</span></div>
      </div>

      <div id="logo">
        <span class="nin">Nintendo</span><span class="gb">GAME BOY</span><span class="tm">TM</span>
      </div>

      <div id="dpad">
        <div class="dp up" data-key="up"></div>
        <div class="dp left" data-key="left"></div>
        <div class="dp-center"></div>
        <div class="dp right" data-key="right"></div>
        <div class="dp down" data-key="down"></div>
      </div>

      <div id="ab">
        <div class="ab b" data-key="b">B</div>
        <div class="ab a" data-key="a">A</div>
      </div>

      <div id="startsel">
        <div class="syswrap"><div class="sys" data-key="select"></div><span>SELECT</span></div>
        <div class="syswrap"><div class="sys" data-key="start"></div><span>START</span></div>
      </div>

      <div id="speaker"></div>
    </div>
  </div>
</div>

<div id="overlay">
  <div class="poke"></div>
  <h1>Pokémon Amarillo</h1>
  <p id="ov-sub">Edición especial</p>
  <button id="play">Jugar</button>
  <button id="ov-reset" hidden>Reiniciar partida</button>
  <div id="ov-status"></div>
  <div id="ov-hint">Se abre a pantalla completa · Tu progreso se guarda solo</div>
</div>

<div id="toast"></div>

<script src="GameBoyCore.js"></script>
<script src="GameBoyIO.js"></script>
<script>
"use strict";

/* =========================================================
   Puentes que espera GameBoyIO.js
   ========================================================= */
function cout(msg, level) { if (level >= 2) console.warn('[GB]', msg); }

function findValue(name) {
  var val = localStorage.getItem(name);
  if (val === null) return null;
  try { return JSON.parse(val); } catch (e) { return val; }
}
function setValue(name, value) { localStorage.setItem(name, JSON.stringify(value)); }
function deleteValue(name) { localStorage.removeItem(name); }

function arrayToBase64(arr) {
  var str = '';
  for (var i = 0; i < arr.length; i++) str += String.fromCharCode(arr[i]);
  return btoa(str);
}
function base64ToArray(str) {
  var s = atob(str);
  var arr = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) arr[i] = s.charCodeAt(i);
  return arr;
}
function to_little_endian_dword(val) {
  return String.fromCharCode(val & 0xFF, (val >> 8) & 0xFF, (val >> 16) & 0xFF, (val >> 24) & 0xFF);
}
function to_byte(val) { return String.fromCharCode(val & 0xFF); }

/* =========================================================
   Audio (Web Audio API)
   ========================================================= */
var audioCtx = null;
var audioScriptNode = null;
var audioBufferQueue = [];
var audioVolume = 1;

function ensureAudio() {
  if (audioCtx && audioCtx.state !== 'closed') return audioCtx;
  audioScriptNode = null;
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  try { audioCtx = new Ctor({ sampleRate: 44100 }); } catch (e) { audioCtx = null; }
  return audioCtx;
}

function ensureAudioNode() {
  var ctx = ensureAudio();
  if (!ctx) return null;
  if (!audioScriptNode) {
    audioScriptNode = ctx.createScriptProcessor(4096, 0, 2);
    audioScriptNode.onaudioprocess = function (e) {
      var left = e.outputBuffer.getChannelData(0);
      var right = e.outputBuffer.getChannelData(1);
      var len = left.length;
      for (var i = 0; i < len; i++) {
        if (audioBufferQueue.length > 0) {
          var sample = audioBufferQueue.shift();
          left[i] = sample[0] * audioVolume;
          right[i] = sample[1] * audioVolume;
        } else {
          left[i] = 0;
          right[i] = 0;
        }
      }
    };
    audioScriptNode.connect(ctx.destination);
  }
  return audioScriptNode;
}

function XAudioServer(channels, sampleRate, bufferedAmount, lowWaterMark, highWaterMark, volume, errorCallback) {
  this.channels = channels;
  this.sampleRate = sampleRate;
  this.volume = volume || 1;
  this.initialized = true;
  this.stopped = false;
  audioVolume = this.volume;
  try { ensureAudioNode(); } catch (e) { console.warn('Audio init failed:', e); }
}
XAudioServer.prototype.initialize = function () {};
XAudioServer.prototype.start = function () {
  ensureAudioNode();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
};
XAudioServer.prototype.stop = function () { this.stopped = true; };
XAudioServer.prototype.writeAudio = function (buffer) { this.writeAudioNoCallback(buffer); return buffer.length; };
XAudioServer.prototype.writeAudioNoCallback = function (buffer) {
  if (!audioCtx || this.stopped) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  for (var i = 0; i < buffer.length; i += 2) audioBufferQueue.push([buffer[i], buffer[i + 1]]);
  if (audioBufferQueue.length > 16384) audioBufferQueue.splice(0, audioBufferQueue.length - 8192);
};
XAudioServer.prototype.flushAudio = function () { audioBufferQueue = []; };
XAudioServer.prototype.cancel = function () { audioBufferQueue = []; };
XAudioServer.prototype.changeVolume = function (v) { this.volume = v; audioVolume = v; };
XAudioServer.prototype.remainingBuffer = function () { return audioBufferQueue.length; };
Object.defineProperty(XAudioServer.prototype, 'samplesAvailable', {
  get: function () { return Math.floor(audioBufferQueue.length / 2); }
});

function resumeAudio() {
  ensureAudioNode();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

/* =========================================================
   Estado de la app
   ========================================================= */
var $ = function (id) { return document.getElementById(id); };
var KEY_STATE = 'PBY_FREEZE_V1';
var ROM_URL = 'yellow.gbc';
var romString = null;
var romBytes = null;
var started = false;
var paused = false;

/* =========================================================
   Entrada
   ========================================================= */
var KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  KeyZ: 'a', KeyX: 'b', ShiftLeft: 'select', Enter: 'start', Space: 'a'
};

function setInput(key, pressed) {
  if (!gameboy) return;
  var el = document.querySelector('[data-key="' + key + '"]');
  if (el) el.classList.toggle('pressed', pressed);
  var map = { right: 0, left: 1, up: 2, down: 3, a: 4, b: 5, select: 6, start: 7 };
  var bit = map[key];
  if (bit !== undefined) gameboy.JoyPadEvent(bit, pressed);
}

function setupInput() {
  document.querySelectorAll('[data-key]').forEach(function (btn) {
    var key = btn.dataset.key;
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      setInput(key, true);
    });
    var release = function (e) { e.preventDefault(); setInput(key, false); };
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('lostpointercapture', function () { setInput(key, false); });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  document.addEventListener('keydown', function (e) {
    var k = KEYMAP[e.code];
    if (k) { e.preventDefault(); setInput(k, true); }
  });
  document.addEventListener('keyup', function (e) {
    var k = KEYMAP[e.code];
    if (k) { e.preventDefault(); setInput(k, false); }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && started && gameboy) { try { saveSRAM(); } catch (e) {} }
  });
  window.addEventListener('beforeunload', function () {
    if (started && gameboy) { try { saveSRAM(); } catch (e) {} }
  });
  $('gb').addEventListener('contextmenu', function (e) { e.preventDefault(); });
}

/* =========================================================
   ROM
   ========================================================= */
async function fetchRom() {
  if (romString) return romString;
  var resp = await fetch(ROM_URL, { cache: 'no-cache' });
  if (!resp.ok) throw new Error('ROM no encontrada (HTTP ' + resp.status + ')');
  var buf = await resp.arrayBuffer();
  romBytes = new Uint8Array(buf);
  var CHUNK = 0x8000;
  var parts = [];
  for (var i = 0; i < romBytes.length; i += CHUNK) {
    parts.push(String.fromCharCode.apply(null, romBytes.subarray(i, Math.min(i + CHUNK, romBytes.length))));
  }
  romString = parts.join('');
  return romString;
}

/* =========================================================
   Arranque / pausa
   ========================================================= */
async function startGame() {
  var btn = $('play');
  btn.disabled = true;
  setStatus('Cargando juego…');
  try {
    var rom = await fetchRom();
    start($('lcd'), rom);
    started = true;
    paused = false;
    hideOverlay();
    var suffix = (typeof gameboy === 'object' && gameboy && gameboy.name) ? gameboy.name : 'ROM';
    setBar(true);
    setStatus('');
    if (localStorage.getItem(KEY_STATE)) toast('Hay un estado guardado · pulsa Cargar');
  } catch (err) {
    started = false;
    setStatus('Error: ' + err.message, true);
    showOverlay('No se pudo iniciar', 'Reintentar');
  } finally {
    btn.disabled = false;
  }
}

function pauseGame() {
  if (!started || !gameboy) return;
  try { pause(); } catch (e) {}
  paused = true;
  setBar(false);
}

function resumeGame() {
  if (!gameboy) return;
  resumeAudio();
  try { run(); } catch (e) {}
  paused = false;
  started = true;
  setBar(true);
}

function setBar(active) {
  $('btn-save').disabled = !active;
  $('btn-close').disabled = !active;
  $('btn-load').disabled = false;
}

/* =========================================================
   Guardar / cargar estado
   ========================================================= */
function saveStateNow() {
  if (!gameboy || !GameBoyEmulatorPlaying()) { toast('El juego no está en marcha'); return; }
  try {
    var st = gameboy.saveState();
    st[0] = null;                       // la ROM no se guarda: se recupera del servidor
    var json = JSON.stringify(st);
    localStorage.setItem(KEY_STATE, json);
    toast('Estado guardado · ' + Math.round(json.length / 1024) + ' KB');
  } catch (e) {
    toast('No se pudo guardar: ' + e.message);
  }
}

async function loadStateNow() {
  var json = localStorage.getItem(KEY_STATE);
  if (!json) { toast('No hay ningún estado guardado'); return; }
  try {
    await fetchRom();
    var st = JSON.parse(json);
    st[0] = romBytes;
    clearLastEmulation();
    gameboy = new GameBoyCore($('lcd'), romString);
    gameboy.openMBC = openSRAM;
    gameboy.openRTC = openRTC;
    gameboy.returnFromState(st);
    run();
    started = true;
    paused = false;
    setBar(true);
    hideOverlay();
    toast('Estado cargado');
  } catch (e) {
    toast('No se pudo cargar: ' + e.message);
  }
}

/* =========================================================
   Pantalla completa / cerrar
   ========================================================= */
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function goFullscreen() {
  if (isFullscreen()) return;
  var el = $('app');
  try {
    var p = null;
    if (el.requestFullscreen) p = el.requestFullscreen({ navigationUI: 'hide' });
    else if (el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
    // Nunca se espera: si el navegador deja la promesa pendiente,
    // el juego debe arrancar igual.
    if (p && typeof p.catch === 'function') p.catch(function () {});
  } catch (e) { /* iOS no permite fullscreen de elementos */ }
}

function toggleFullscreen() {
  if (isFullscreen()) {
    try {
      if (document.exitFullscreen) document.exitFullscreen().catch(function () {});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (e) {}
  } else {
    goFullscreen();
  }
}

function closeGame() {
  if (isFullscreen()) {
    try {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (e) {}
  }
  pauseGame();
  showOverlay('Partida en pausa', 'Continuar');
  $('ov-reset').hidden = false;
  toast('Pausado · cierra la pestaña cuando quieras');
}

/* =========================================================
   Portada
   ========================================================= */
function showOverlay(sub, playLabel) {
  var ov = $('overlay');
  ov.classList.remove('hidden');
  $('ov-sub').textContent = sub || 'Edición especial';
  $('play').textContent = playLabel || 'Jugar';
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

function hideOverlay() {
  $('overlay').classList.add('hidden');
}

function setStatus(msg, isError) {
  var el = $('ov-status');
  el.textContent = msg || '';
  el.classList.toggle('error', !!isError);
}

/* =========================================================
   Aviso flotante
   ========================================================= */
var toastTimer = null;
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
}

/* =========================================================
   Escalado de la carcasa
   ========================================================= */
function fitShell() {
  var gb = $('gb');
  if (!gb) return;
  var bar = $('topbar').getBoundingClientRect().height + 18;
  var availW = window.innerWidth - 16;
  var availH = window.innerHeight - bar - 10;
  var s = Math.min(availW / 360, availH / 592, 2.2);
  gb.style.transform = 'scale(' + (s > 0 ? s : 0.2) + ')';
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('DOMContentLoaded', function () {
  setupInput();
  fitShell();
  window.addEventListener('resize', fitShell);
  window.addEventListener('orientationchange', function () { setTimeout(fitShell, 120); });
  document.addEventListener('fullscreenchange', fitShell);
  document.addEventListener('webkitfullscreenchange', fitShell);

  $('play').addEventListener('click', async function () {
    var btn = $('play');
    btn.disabled = true;
    goFullscreen();
    resumeAudio();
    try {
      if (paused) { resumeGame(); hideOverlay(); }
      else if (started) { hideOverlay(); }
      else { await startGame(); }
    } finally {
      btn.disabled = false;
      fitShell();
    }
  });

  $('ov-reset').addEventListener('click', function () {
    if (confirm('¿Reiniciar la partida? Se pierde el progreso desde el último guardado.')) location.reload();
  });

  $('btn-save').addEventListener('click', saveStateNow);
  $('btn-load').addEventListener('click', loadStateNow);
  $('btn-fs').addEventListener('click', toggleFullscreen);
  $('btn-close').addEventListener('click', closeGame);

  if (localStorage.getItem(KEY_STATE) && !$('btn-load').disabled) { /* listo para cargar */ }

  // Botón flotante de pantalla completa refleja el estado real
  document.addEventListener('fullscreenchange', function () { fitShell(); });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokémon Amarillo">
<meta name="theme-color" content="#0b0b10">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pokémon Amarillo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;background:#08080c;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;overscroll-behavior:none;
}
/* Fondo con una luz suave: evita que las franjas alrededor de la
   carcasa parezcan un descuido. */
body{
  background:
    radial-gradient(130% 75% at 50% -12%,#25262f 0%,#14141c 44%,#08080c 100%);
}
#app{height:100dvh;display:flex;flex-direction:column;align-items:center;gap:0;padding:0 0 4px}

/* ---------- barra superior ---------- */
#topbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;flex-shrink:0;z-index:5;padding:7px 6px 5px}
.tb{
  appearance:none;border:1px solid #2c2c38;background:#16161d;color:#c3c3cf;
  font:600 10.5px/1 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;
  padding:8px 11px;border-radius:7px;cursor:pointer;transition:background .12s,color .12s,opacity .12s;
}
.tb:hover:not(:disabled){background:#22222e;color:#fff}
.tb:active:not(:disabled){transform:translateY(1px)}
.tb:disabled{opacity:.32;cursor:default}
/* Botón de respaldo de pantalla completa: solo aparece si el intento
   automático no funcionó, y se resalta para que no haya duda. */
#btn-fs{border-color:#41603a;color:#d2e7a2;background:#172015}
#btn-fs:hover:not(:disabled){background:#1e2a1a;color:#eaf6c7}

#stage{flex:1;display:grid;place-items:center;min-height:0;width:100%;overflow:hidden}

/* ---------- carcasa 360 x 610 (proporcion DMG original) ---------- */
#gb{
  position:relative;width:360px;height:610px;flex-shrink:0;
  border-radius:18px 18px 76px 18px;
  background-color:#d6d1c4;
  background-image:
    /* grano del plastico ABS */
    repeating-linear-gradient(90deg,rgba(0,0,0,.022) 0 1px,rgba(255,255,255,.030) 1px 3px),
    /* luz cenital */
    radial-gradient(150% 95% at 27% 6%,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 62%),
    linear-gradient(157deg,#e9e5db 0%,#d7d2c6 44%,#c5c0b2 80%,#b8b3a5 100%);
  box-shadow:
    0 24px 52px rgba(0,0,0,.65),
    inset 0 2px 1px rgba(255,255,255,.9),
    inset -4px -6px 18px rgba(0,0,0,.18),
    inset 3px 0 9px rgba(255,255,255,.3);
  transform-origin:center center;
  will-change:transform;
}
/* linea de union de las dos mitades de la carcasa */
#gb::before{
  content:'';position:absolute;inset:7px;border-radius:14px 14px 70px 14px;
  border:1px solid rgba(0,0,0,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  pointer-events:none;
}

/* pantalla: marco fino, 10,10 -> 340 x 336 */
#bezel{
  position:absolute;left:10px;top:10px;width:340px;height:336px;
  background:linear-gradient(150deg,#5e5e69 0%,#45454f 45%,#33333c 100%);
  border-radius:12px 12px 22px 12px;
  box-shadow:
    inset 0 2px 2px rgba(255,255,255,.16),
    inset 0 -4px 10px rgba(0,0,0,.55),
    0 1px 0 rgba(255,255,255,.6);
  display:flex;flex-direction:column;align-items:center;
  padding-top:10px;
}
.bezel-label{
  font:600 7.5px/1 system-ui;letter-spacing:1.7px;color:#8f8f9e;
  text-transform:uppercase;margin-bottom:4px;
}
.lcd-wrap{position:relative;width:320px;aspect-ratio:160/144;flex-shrink:0}
#lcd{
  display:block;width:100%;height:100%;background:#9bbc0f;
  image-rendering:pixelated;image-rendering:crisp-edges;
  border-radius:5px 5px 5px 14px;
  box-shadow:0 0 0 2px #2a2a32,0 0 26px rgba(140,180,20,.12),inset 0 0 22px rgba(0,0,0,.28);
}
/* shader del LCD: dibuja el canvas real con la rejilla y los 4 verdes del DMG */
#fx{
  position:absolute;inset:0;width:100%;height:100%;display:none;
  border-radius:5px 5px 5px 14px;pointer-events:none;background:#9bbc0f;
  z-index:1;
}
.lcd-wrap.fx-on #fx{display:block}
/* reflejo del cristal: el detalle mas reconocible del DMG */
.lcd-wrap .glass{
  position:absolute;inset:0;border-radius:5px 5px 5px 14px;pointer-events:none;z-index:2;
  background:linear-gradient(118deg,
    rgba(255,255,255,.15) 0%,
    rgba(255,255,255,.055) 20%,
    rgba(255,255,255,.015) 33%,
    rgba(255,255,255,0) 46%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);
}
.bezel-foot{
  display:flex;align-items:center;gap:7px;align-self:flex-start;
  padding-left:16px;margin-top:6px;
  font:600 7px/1 system-ui;letter-spacing:1.5px;color:#8f8f9e;text-transform:uppercase;
}
#led{
  width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff7a72,#c11a1a 62%,#6d0a0a);
  box-shadow:0 0 7px rgba(255,60,50,.75),inset 0 0 2px rgba(0,0,0,.6);
}

/* aviso sobre la pantalla */
#banner{
  position:absolute;left:50%;top:176px;transform:translate(-50%,-50%);
  background:rgba(8,8,12,.84);color:#eaeaF4;
  font:600 10.5px/1.35 system-ui;letter-spacing:.06em;text-transform:uppercase;
  padding:9px 15px;border-radius:7px;text-align:center;
  max-width:210px;pointer-events:none;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
  transition:opacity .2s;
}
#banner.hide{opacity:0}
#banner.error{color:#ff8f8f;text-transform:none}

/* logo */
#logo{
  position:absolute;left:30px;top:354px;line-height:1;
  color:#3b3f66;display:flex;align-items:baseline;gap:5px;pointer-events:none;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
#logo .nin{font:600 12px/1 system-ui;letter-spacing:.2px}
#logo .gb{font:800 italic 17px/1 system-ui;letter-spacing:1.1px}
#logo .tm{font:600 6px/1 system-ui;align-self:flex-start;margin-top:2px;opacity:.8}

/* cruceta: 28,382 -> 108 x 108 */
#dpad{position:absolute;left:28px;top:382px;width:108px;height:108px;pointer-events:none}
.dp{
  position:absolute;width:36px;height:36px;pointer-events:auto;cursor:pointer;
  background:linear-gradient(170deg,#33333d,#1b1b21 75%);
  box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 3px rgba(0,0,0,.4);
}
.dp.up{left:36px;top:0;border-radius:5px 5px 0 0}
.dp.down{left:36px;bottom:0;border-radius:0 0 5px 5px}
.dp.left{left:0;top:36px;border-radius:5px 0 0 5px}
.dp.right{right:0;top:36px;border-radius:0 5px 5px 0}
.dp-center{
  position:absolute;left:36px;top:36px;width:36px;height:36px;
  background:linear-gradient(170deg,#33333d,#1b1b21 75%);
}
.dp-center::after{
  content:'';position:absolute;inset:12px;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,rgba(255,255,255,.10),rgba(0,0,0,.28));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
}
.dp::after{
  content:'';position:absolute;top:50%;left:50%;width:0;height:0;
  border:5px solid transparent;
}
.dp.up::after{transform:translate(-50%,-62%);border-bottom-color:#5c5c6b}
.dp.down::after{transform:translate(-50%,-38%);border-top-color:#5c5c6b}
.dp.left::after{transform:translate(-62%,-50%);border-right-color:#5c5c6b}
.dp.right::after{transform:translate(-38%,-50%);border-left-color:#5c5c6b}
.dp.pressed{background:linear-gradient(170deg,#43434f,#26262e 75%)}

/* A y B: círculos de 54, centros en (276,396) y (214,434) */
.ab{
  position:absolute;width:54px;height:54px;border-radius:50%;pointer-events:auto;cursor:pointer;
  background:radial-gradient(circle at 34% 28%,#cf4d88 0%,#a52763 45%,#7c1750 78%,#61103f 100%);
  color:#f4dbe8;font:800 14px/1 system-ui;
  display:flex;align-items:center;justify-content:center;
  box-shadow:
    0 3px 6px rgba(0,0,0,.5),
    0 1px 0 rgba(255,255,255,.5),
    inset 0 2px 2px rgba(255,255,255,.3),
    inset 0 -4px 8px rgba(0,0,0,.35);
  transition:transform .06s,box-shadow .06s;
}
.ab.a{left:249px;top:376px}
.ab.b{left:187px;top:414px}
.ab.pressed{transform:scale(.94);box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 3px 6px rgba(0,0,0,.4)}
.ab::after{
  content:'';position:absolute;inset:5px;border-radius:50%;
  border:1px solid rgba(255,255,255,.13);
  box-shadow:inset 0 0 6px rgba(0,0,0,.18);
  pointer-events:none;
}
.ab{text-shadow:0 1px 1px rgba(0,0,0,.45)}

/* select / start: 106,502 */
#startsel{
  position:absolute;left:106px;top:502px;display:flex;gap:16px;
  transform:rotate(-14deg);transform-origin:center center;pointer-events:none;
}
.syswrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.sys{
  width:46px;height:12px;border-radius:7px;pointer-events:auto;cursor:pointer;
  background:linear-gradient(170deg,#43434e,#282830);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.55);
  transition:background .06s;
}
.sys.pressed{background:linear-gradient(170deg,#2f2f38,#1d1d24)}
.syswrap span{font:600 6.5px/1 system-ui;letter-spacing:1.2px;color:#6f6f7d}

/* altavoz: ranuras diagonales como en el DMG, 246,512 -> 92 x 72 */
#speaker{
  position:absolute;right:22px;bottom:26px;width:92px;height:72px;
  border-radius:6px;pointer-events:none;overflow:hidden;
  background:linear-gradient(160deg,#ded9cc,#c6c1b2);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3),inset 0 -1px 0 rgba(255,255,255,.55);
}
#speaker::before{
  content:'';position:absolute;left:-35%;top:-70%;width:170%;height:240%;
  transform:rotate(-24deg);
  background:repeating-linear-gradient(90deg,
    rgba(96,91,80,.62) 0 5px,
    rgba(255,255,255,.30) 5px 6px,
    rgba(0,0,0,0) 6px 15px);
  opacity:.85;
}

/* ---------- aviso flotante ---------- */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);
  background:rgba(24,24,32,.95);border:1px solid #2f2f3d;color:#dcdcea;
  font:600 11.5px/1 system-ui;letter-spacing:.05em;
  padding:11px 18px;border-radius:9px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- aviso de rotación (respaldo si el sistema no deja fijarla) ---------- */
#rotate{
  position:fixed;inset:0;z-index:80;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:32px 26px calc(32px + env(safe-area-inset-bottom,0px));
  text-align:center;color:#ececf6;
  background:radial-gradient(120% 80% at 50% 28%,#1c1d26 0%,#0a0a10 62%,#050508 100%);
}
#rotate.show{display:flex}
#rotate .phone{
  position:relative;width:72px;height:124px;border-radius:14px;
  border:2px solid #7b7b8c;background:linear-gradient(160deg,#26262f,#14141a);
  box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.5);
  animation:tip 2.8s ease-in-out infinite;
}
#rotate .phone::after{
  content:'';position:absolute;left:50%;bottom:7px;width:24px;height:24px;
  border-radius:50%;border:1px solid #6f6f80;transform:translateX(-50%);
}
@keyframes tip{
  0%,18%{transform:rotate(90deg)}
  52%,100%{transform:rotate(0deg)}
}
#rotate h2{font:700 17px/1.25 system-ui;letter-spacing:.02em}
#rotate p{font:500 12.5px/1.5 system-ui;color:#a8a8ba;max-width:262px}
#rotate button{
  appearance:none;border:1px solid #33333f;background:#16161d;color:#b9b9c8;
  font:600 10.5px/1 system-ui;letter-spacing:.09em;text-transform:uppercase;
  padding:11px 18px;border-radius:8px;cursor:pointer;
}
#rotate button:hover{background:#22222e;color:#fff}
@media (prefers-reduced-motion:reduce){#rotate .phone{animation:none;transform:rotate(0)}}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <button class="tb" id="btn-save" disabled>Guardar</button>
    <button class="tb" id="btn-load" disabled>Cargar</button>
    <button class="tb" id="btn-fs" hidden>Pantalla completa</button>
  </div>

  <div id="stage">
    <div id="gb">
      <div id="bezel">
        <div class="bezel-label">Dot Matrix with Stereo Sound</div>
        <div class="lcd-wrap">
          <canvas id="lcd" width="160" height="144"></canvas>
          <canvas id="fx"></canvas>
          <span class="glass"></span>
        </div>
        <div class="bezel-foot"><span id="led"></span><span>Battery</span></div>
      </div>

      <div id="banner" class="hide"></div>

      <div id="logo">
        <span class="nin">Nintendo</span><span class="gb">GAME BOY</span><span class="tm">TM</span>
      </div>

      <div id="dpad">
        <div class="dp up" data-key="up"></div>
        <div class="dp left" data-key="left"></div>
        <div class="dp-center"></div>
        <div class="dp right" data-key="right"></div>
        <div class="dp down" data-key="down"></div>
      </div>

      <div class="ab b" data-key="b">B</div>
      <div class="ab a" data-key="a">A</div>

      <div id="startsel">
        <div class="syswrap"><div class="sys" data-key="select"></div><span>SELECT</span></div>
        <div class="syswrap"><div class="sys" data-key="start"></div><span>START</span></div>
      </div>

      <div id="speaker"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="rotate" aria-hidden="true">
  <div class="phone" aria-hidden="true"></div>
  <h2>Pon el móvil en vertical</h2>
  <p>Esta Game Boy solo se juega en vertical. Gira el dispositivo para seguir donde lo dejaste.</p>
  <button id="rotate-skip" type="button">Continuar en horizontal</button>
</div>

<script src="GameBoyCore.js"></script>
<script src="GameBoyIO.js"></script>
<script>
"use strict";

/* =========================================================
   Puentes que espera GameBoyIO.js
   ========================================================= */
function cout(msg, level) { if (level >= 2) console.warn('[GB]', msg); }

function findValue(name) {
  var val = localStorage.getItem(name);
  if (val === null) return null;
  try { return JSON.parse(val); } catch (e) { return val; }
}
function setValue(name, value) { localStorage.setItem(name, JSON.stringify(value)); }
function deleteValue(name) { localStorage.removeItem(name); }

function arrayToBase64(arr) {
  var str = '';
  for (var i = 0; i < arr.length; i++) str += String.fromCharCode(arr[i]);
  return btoa(str);
}
function base64ToArray(str) {
  var s = atob(str);
  var arr = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) arr[i] = s.charCodeAt(i);
  return arr;
}
function to_little_endian_dword(val) {
  return String.fromCharCode(val & 0xFF, (val >> 8) & 0xFF, (val >> 16) & 0xFF, (val >> 24) & 0xFF);
}
function to_byte(val) { return String.fromCharCode(val & 0xFF); }

/* =========================================================
   Audio (Web Audio API)
   El núcleo entrega unos 350 pares de muestras cada 8 ms; aquí se
   guardan en un búfer circular y se consumen de forma continua.
   Así no hay cortes ni el coste de mantener una cola de arrays.
   ========================================================= */
var audioCtx = null;
var audioScriptNode = null;
var audioVolume = 1;

var AUDIO_RING_FRAMES = 8192;               // ~186 ms a 44,1 kHz
var AUDIO_TARGET_FRAMES = 4096;             // latencia objetivo (~93 ms)
var audioRingL = new Float32Array(AUDIO_RING_FRAMES);
var audioRingR = new Float32Array(AUDIO_RING_FRAMES);
var audioWritePos = 0, audioReadPos = 0, audioCount = 0;
var audioFrac = 0;                          // posición fraccionaria (remuestreo fino)
var audioTrimmed = false;
var audioConsumed = 0;                      // frames entregados a la salida

function ensureAudio() {
  if (audioCtx && audioCtx.state !== 'closed') return audioCtx;
  audioScriptNode = null;
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  try {
    // 44100 Hz es la frecuencia real del emulador (4194304 / 95).
    audioCtx = new Ctor({ sampleRate: 44100 });
  } catch (e) {
    try { audioCtx = new Ctor(); } catch (e2) { audioCtx = null; }
  }
  audioWritePos = audioReadPos = audioCount = 0;
  audioTrimmed = false;
  return audioCtx;
}

function ensureAudioNode() {
  var ctx = ensureAudio();
  if (!ctx) return null;
  if (!audioScriptNode) {
    var node = ctx.createScriptProcessor(2048, 0, 2);
    // Estado de los filtros (por canal). El núcleo entrega la señal
    // desplazada en continua, así que primero se quita el nivel fijo y
    // después se suavizan los agudos como en el altavoz del DMG.
    var HP_R = 0.995;                       // ~35 Hz
    var LP_A = 0.7417;                      // ~9,5 kHz a 44,1 kHz
    var hpInL = 0, hpInR = 0, hpOutL = 0, hpOutR = 0;
    var lpL = 0, lpR = 0;
    var fade = 0;                           // evita chasquidos al quedarse sin datos
    node.onaudioprocess = function (e) {
      // La primera vez que suena, el búfer puede traer todo lo generado
      // mientras el AudioContext estaba en pausa. Se recorta al objetivo
      // para que la latencia no crezca con el tiempo.
      if (!audioTrimmed) {
        audioTrimmed = true;
        if (audioCount > AUDIO_TARGET_FRAMES) {
          audioReadPos = (audioReadPos + audioCount - AUDIO_TARGET_FRAMES) % AUDIO_RING_FRAMES;
          audioCount = AUDIO_TARGET_FRAMES;
          audioFrac = 0;
        }
      }
      var outL = e.outputBuffer.getChannelData(0);
      var outR = e.outputBuffer.getChannelData(1);
      var n = outL.length;
      var vol = audioVolume;
      // Control de latencia: si el búfer se aleja del objetivo se consume
      // un poco más rápido o más lento (±1 %, imperceptible en el tono).
      var step = 1 + (audioCount - AUDIO_TARGET_FRAMES) * 2e-5;
      if (step > 1.015) step = 1.015;
      else if (step < 0.985) step = 0.985;
      for (var i = 0; i < n; i++) {
        var xl = 0, xr = 0;
        if (audioCount > 1) {
          // Interpolación lineal entre las dos muestras vecinas.
          var i0 = audioReadPos;
          var i1 = (i0 + 1) % AUDIO_RING_FRAMES;
          var f = audioFrac;
          xl = audioRingL[i0] + (audioRingL[i1] - audioRingL[i0]) * f;
          xr = audioRingR[i0] + (audioRingR[i1] - audioRingR[i0]) * f;
          audioFrac += step;
          if (audioFrac >= 1) {
            var adv = Math.floor(audioFrac);
            audioFrac -= adv;
            audioReadPos = (audioReadPos + adv) % AUDIO_RING_FRAMES;
            audioCount -= adv;
            audioConsumed += adv;
          }
          if (fade < 1) fade = Math.min(1, fade + 0.004);
        } else if (audioCount === 1) {
          xl = audioRingL[audioReadPos];
          xr = audioRingR[audioReadPos];
          audioReadPos = (audioReadPos + 1) % AUDIO_RING_FRAMES;
          audioCount = 0;
          audioFrac = 0;
          audioConsumed++;
          if (fade < 1) fade = Math.min(1, fade + 0.004);
        } else {
          audioFrac = 0;
          if (fade > 0) fade = Math.max(0, fade - 0.004);
        }
        var yl = xl - hpInL + HP_R * hpOutL;
        hpInL = xl; hpOutL = yl;
        var yr = xr - hpInR + HP_R * hpOutR;
        hpInR = xr; hpOutR = yr;
        lpL += LP_A * (yl - lpL);
        lpR += LP_A * (yr - lpR);
        outL[i] = lpL * vol * fade * 0.9;
        outR[i] = lpR * vol * fade * 0.9;
      }
    };
    audioScriptNode = node;
    node.connect(ctx.destination);
  }
  return audioScriptNode;
}

function XAudioServer(channels, sampleRate, bufferedAmount, lowWaterMark, highWaterMark, volume, errorCallback) {
  this.channels = channels;
  this.sampleRate = sampleRate;
  this.volume = volume || 1;
  this.initialized = true;
  this.stopped = false;
  audioVolume = this.volume;
  try { ensureAudioNode(); } catch (e) { console.warn('Audio init failed:', e); }
}
XAudioServer.prototype.initialize = function () {};
XAudioServer.prototype.start = function () {
  ensureAudioNode();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
};
XAudioServer.prototype.stop = function () { this.stopped = true; };
XAudioServer.prototype.writeAudio = function (buffer) { this.writeAudioNoCallback(buffer); return buffer.length; };
XAudioServer.prototype.writeAudioNoCallback = function (buffer) {
  if (!buffer || this.stopped) return;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  var frames = buffer.length >> 1;
  if (frames <= 0) return;
  // Si el búfer se llena, se descarta lo más viejo: la latencia nunca
  // supera el tamaño del anillo.
  var overflow = audioCount + frames - AUDIO_RING_FRAMES;
  if (overflow > 0) {
    audioReadPos = (audioReadPos + overflow) % AUDIO_RING_FRAMES;
    audioCount -= overflow;
  }
  var w = audioWritePos;
  for (var i = 0, s = 0; i < frames; i++, s += 2) {
    audioRingL[w] = buffer[s];
    audioRingR[w] = buffer[s + 1];
    w = (w + 1) % AUDIO_RING_FRAMES;
  }
  audioWritePos = w;
  audioCount += frames;
};
XAudioServer.prototype.flushAudio = function () { audioReadPos = audioWritePos = audioCount = 0; };
XAudioServer.prototype.cancel = function () { audioReadPos = audioWritePos = audioCount = 0; };
XAudioServer.prototype.changeVolume = function (v) { this.volume = v; audioVolume = v; };
// El núcleo trabaja en muestras intercaladas (L,R), así que se devuelve
// el doble de frames. El control de flujo lo lleva startClockServo().
XAudioServer.prototype.remainingBuffer = function () { return audioCount * 2; };
Object.defineProperty(XAudioServer.prototype, 'samplesAvailable', {
  get: function () { return audioCount; }
});

function resumeAudio() {
  ensureAudioNode();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

/* =========================================================
   Estado
   ========================================================= */
var $ = function (id) { return document.getElementById(id); };
var KEY_STATE = 'PBY_FREEZE_V1';
var KEY_ROM = 'PBY_FREEZE_ROM';
var ROM_URL = 'amarillo.gb';
var romString = null;
var romBytes = null;
var started = false;
var paused = false;
var bannerTimer = null;

/* =========================================================
   Entrada
   ========================================================= */
var KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  KeyZ: 'a', KeyX: 'b', ShiftLeft: 'select', Enter: 'start', Space: 'a'
};

function setInput(key, pressed) {
  if (!gameboy) return;
  var el = document.querySelector('[data-key="' + key + '"]');
  if (el) el.classList.toggle('pressed', pressed);
  var map = { right: 0, left: 1, up: 2, down: 3, a: 4, b: 5, select: 6, start: 7 };
  var bit = map[key];
  if (bit !== undefined) gameboy.JoyPadEvent(bit, pressed);
}

function setupInput() {
  document.querySelectorAll('[data-key]').forEach(function (btn) {
    var key = btn.dataset.key;
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      setInput(key, true);
    });
    var release = function (e) { e.preventDefault(); setInput(key, false); };
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('lostpointercapture', function () { setInput(key, false); });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  document.addEventListener('keydown', function (e) {
    var k = KEYMAP[e.code];
    if (k) { e.preventDefault(); setInput(k, true); }
  });
  document.addEventListener('keyup', function (e) {
    var k = KEYMAP[e.code];
    if (k) { e.preventDefault(); setInput(k, false); }
  });

  // En móvil el AudioContext nace en pausa hasta el primer gesto.
  // Se reanuda en cualquier toque o tecla, sin bloquear los controles.
  ['pointerdown', 'touchend', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, resumeAudio, { passive: true });
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (started && !paused) pauseGame();
      try { saveSRAM(); } catch (e) {}
    } else if (started && paused) {
      resumeGame();
    }
  });
  window.addEventListener('beforeunload', function () {
    if (started && gameboy) { try { saveSRAM(); } catch (e) {} }
  });
  $('gb').addEventListener('contextmenu', function (e) { e.preventDefault(); });
}

/* =========================================================
   ROM
   ========================================================= */
async function fetchRom() {
  if (romString) return romString;
  var resp = await fetch(ROM_URL, { cache: 'no-cache' });
  if (!resp.ok) throw new Error('ROM no encontrada (HTTP ' + resp.status + ')');
  var buf = await resp.arrayBuffer();
  romBytes = new Uint8Array(buf);
  var CHUNK = 0x8000;
  var parts = [];
  for (var i = 0; i < romBytes.length; i += CHUNK) {
    parts.push(String.fromCharCode.apply(null, romBytes.subarray(i, Math.min(i + CHUNK, romBytes.length))));
  }
  romString = parts.join('');
  return romString;
}

// Identifica la ROM por su cabecera completa (título, código, versión y
// sumas de comprobación). El nombre corto que expone el núcleo es el mismo
// en todas las versiones de Pokémon Amarillo, así que no sirve para esto.
function romId() {
  if (!romBytes) return '';
  var hex = '';
  for (var i = 0x134; i <= 0x14F; i++) hex += ('0' + romBytes[i].toString(16)).slice(-2);
  return romBytes.length + '-' + hex;
}

// Un estado congelado guarda la CPU, la PPU y los punteros de texto de una
// ROM concreta. Al cambiar de versión (inglés -> español) ese estado deja
// de ser válido, así que se descarta en cuanto arranca la ROM nueva.
// La partida del juego (SRAM) sí se conserva: es el mismo juego.
function syncRomState() {
  var id = romId();
  if (!id) return;
  var prev = localStorage.getItem(KEY_ROM);
  if (prev === id) return;
  if (localStorage.getItem(KEY_STATE)) {
    localStorage.removeItem(KEY_STATE);
    toast('Partida congelada de la versión anterior descartada');
  }
  localStorage.setItem(KEY_ROM, id);
}

/* =========================================================
   Arranque automático
   ========================================================= */
// El temporizador del navegador no corre siempre a 8 ms exactos, así que
// cada segundo se mide cuánto audio se genera y se ajustan los ciclos por
// iteración para producir justo 44.100 muestras/s. El tono no cambia y el
// búfer se mantiene estable. (El control de flujo propio del núcleo se
// desactiva para que no compita con este.)
var clockServoTimer = null;
function startClockServo() {
  if (!gameboy) return;
  gameboy.bufferContainAmount = 0;
  if (clockServoTimer) clearInterval(clockServoTimer);
  var lastTime = performance.now();
  var lastCount = audioCount;
  var lastConsumed = audioConsumed;
  clockServoTimer = setInterval(function () {
    var now = performance.now();
    var dt = (now - lastTime) / 1000;
    if (dt < 0.25 || !gameboy || !started || paused) {
      lastTime = now; lastCount = audioCount; lastConsumed = audioConsumed;
      return;
    }
    var prod = ((audioCount - lastCount) + (audioConsumed - lastConsumed)) / dt;
    lastTime = now; lastCount = audioCount; lastConsumed = audioConsumed;
    if (!isFinite(prod) || prod < 10000 || prod > 120000) return;
    var ratio = Math.pow(44100 / prod, 0.5);
    ratio = Math.max(0.98, Math.min(1.02, ratio));
    gameboy.CPUCyclesTotalBase = Math.round(gameboy.CPUCyclesTotalBase * ratio);
    gameboy.CPUCyclesTotal = gameboy.CPUCyclesTotalBase;
  }, 1000);
}

async function bootGame() {
  setBanner('Cargando…', 0);
  try {
    var rom = await fetchRom();
    setBanner('Iniciando…', 0);
    start($('lcd'), rom);
    startClockServo();
    started = true;
    paused = false;
    setBar(true);
    syncRomState();
    // Si la página se abrió en horizontal en un móvil, el aviso de rotación
    // ya está tapando el juego: se queda en pausa hasta que se gire.
    if ($('rotate').classList.contains('show')) pauseGame();
    if (!isInstalledApp()) setBanner('Toca la pantalla para pantalla completa', 3600);
  } catch (err) {
    setBanner('Error: ' + err.message, 0, true);
  }
}

function pauseGame() {
  if (!started || !gameboy) return;
  try { pause(); } catch (e) {}
  paused = true;
  setBar(false);
}

function resumeGame() {
  if (!gameboy || !started) return;
  resumeAudio();
  try { run(); } catch (e) {}
  paused = false;
  setBar(true);
}

function setBar(active) {
  $('btn-save').disabled = !active;
  $('btn-load').disabled = false;
}

/* =========================================================
   Guardar / cargar estado
   ========================================================= */
function saveStateNow() {
  if (!gameboy || !GameBoyEmulatorPlaying()) { toast('El juego no está en marcha'); return; }
  try {
    syncRomState();
    var st = gameboy.saveState();
    st[0] = null;                       // la ROM no se guarda: se recupera del servidor
    var json = JSON.stringify(st);
    localStorage.setItem(KEY_STATE, json);
    toast('Estado guardado · ' + Math.round(json.length / 1024) + ' KB');
  } catch (e) {
    toast('No se pudo guardar: ' + e.message);
  }
}

async function loadStateNow() {
  var json = localStorage.getItem(KEY_STATE);
  if (!json) { toast('No hay ningún estado guardado'); return; }
  try {
    await fetchRom();
    if (localStorage.getItem(KEY_ROM) !== romId()) {
      toast('Ese estado es de otra versión del juego');
      return;
    }
    var st = JSON.parse(json);
    st[0] = romBytes;
    clearLastEmulation();
    gameboy = new GameBoyCore($('lcd'), romString);
    gameboy.openMBC = openSRAM;
    gameboy.openRTC = openRTC;
    gameboy.returnFromState(st);
    startClockServo();
    run();
    started = true;
    paused = false;
    setBar(true);
    setBanner(null);
    if ($('rotate').classList.contains('show')) pauseGame();
    toast('Estado cargado');
  } catch (e) {
    toast('No se pudo cargar: ' + e.message);
  }
}

/* =========================================================
   Pantalla completa
   ========================================================= */
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}

// Instalada en la pantalla de inicio se abre ya a pantalla completa: no hay
// que pedir la API (y Chrome no muestra su aviso de "arrastra desde arriba").
function isInstalledApp() {
  try {
    if (window.navigator.standalone === true) return true;
    if (!window.matchMedia) return false;
    return window.matchMedia('(display-mode: fullscreen)').matches ||
           window.matchMedia('(display-mode: standalone)').matches;
  } catch (e) { return false; }
}

// El botón de respaldo solo se muestra cuando el intento automático no funcionó.
function setFsChip(show) {
  var b = $('btn-fs');
  if (b) b.hidden = !show;
}

function goFullscreen() {
  if (isInstalledApp()) { setFsChip(false); return true; }
  if (isFullscreen()) { setFsChip(false); return true; }
  // La raíz del documento es lo más compatible en Chrome, Edge y Firefox.
  var el = document.documentElement;
  try {
    var p = null;
    if (el.requestFullscreen) p = el.requestFullscreen({ navigationUI: 'hide' });
    else if (el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) p = el.msRequestFullscreen();
    else { onFullscreenBlocked('sin API'); return false; }
    // Nunca se espera: si el navegador deja la promesa pendiente,
    // el juego debe seguir funcionando igual.
    if (p && typeof p.catch === 'function') {
      p.catch(function (err) { onFullscreenBlocked(err && err.message); });
    }
    return true;
  } catch (e) {
    onFullscreenBlocked(e && e.message);
    return false;
  }
}

var fsBlockedNotified = false;
function onFullscreenBlocked(reason) {
  if (fsBlockedNotified) return;
  fsBlockedNotified = true;
  if (reason) console.warn('[GB] Pantalla completa no disponible:', reason);
  if (document.fullscreenEnabled === false) {
    toast('Este visor no permite pantalla completa');
  }
}

/* =========================================================
   Rotación: fija la vertical siempre que el navegador lo permita
   ========================================================= */
var rotateDismissed = false;

function lockPortrait() {
  // Android/Chrome solo permite fijar la orientación en pantalla completa.
  try {
    if (screen.orientation && screen.orientation.lock) {
      var p = screen.orientation.lock('portrait');
      if (p && p.catch) p.catch(function () {});
    }
  } catch (e) {}
  // Navegadores antiguos.
  try {
    var legacy = screen.lockOrientation || screen.mozLockOrientation || screen.msLockOrientation;
    if (legacy) legacy.call(screen, 'portrait');
  } catch (e) {}
}

function unlockPortrait() {
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
  try {
    var legacy = screen.unlockOrientation || screen.mozUnlockOrientation || screen.msUnlockOrientation;
    if (legacy) legacy.call(screen);
  } catch (e) {}
}

function isCoarsePointer() {
  return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
}

// Respaldo para iOS y visores que ignoran el bloqueo: en un móvil en
// horizontal se tapa el juego y se pausa hasta girarlo. En un ordenador
// (puntero fino) y en pantallas grandes nunca aparece.
function updateRotateGate() {
  var gate = $('rotate');
  if (!gate) return;
  var landscape = window.innerWidth > window.innerHeight;
  var minSide = Math.min(window.innerWidth, window.innerHeight);
  var show = isCoarsePointer() && landscape && minSide <= 560 && !rotateDismissed;
  if (show === gate.classList.contains('show')) return;
  gate.classList.toggle('show', show);
  gate.setAttribute('aria-hidden', show ? 'false' : 'true');
  if (show) {
    if (started && !paused) pauseGame();
  } else if (started && paused && !document.hidden) {
    resumeGame();
  }
}

/* =========================================================
   Aviso sobre la pantalla
   ========================================================= */
function setBanner(text, durationMs, isError) {
  var b = $('banner');
  clearTimeout(bannerTimer);
  if (!text) {
    b.classList.add('hide');
    b.textContent = '';
    return;
  }
  b.textContent = text;
  b.classList.toggle('error', !!isError);
  b.classList.remove('hide');
  if (durationMs) {
    bannerTimer = setTimeout(function () { b.classList.add('hide'); }, durationMs);
  }
}

var toastTimer = null;
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
}

/* =========================================================
   Shader del LCD: verdes del DMG, rejilla de puntos y sangrado
   ========================================================= */
var fxCanvas = null, fxGl = null, fxProgram = null, fxTex = null;
var fxTexSizeLoc = null, fxFailed = false;

var FX_VERT = [
  'attribute vec2 aPos;',
  'varying vec2 vUv;',
  'void main() {',
  '  vUv = vec2(aPos.x * 0.5 + 0.5, aPos.y * 0.5 + 0.5);',
  '  gl_Position = vec4(aPos, 0.0, 1.0);',
  '}'
].join('\n');

var FX_FRAG = [
  'precision mediump float;',
  'varying vec2 vUv;',
  'uniform sampler2D uTex;',
  'uniform vec2 uTexSize;',
  'const vec3 DMG0 = vec3(0.059, 0.220, 0.059);',   // #0f380f
  'const vec3 DMG1 = vec3(0.188, 0.384, 0.188);',   // #306230
  'const vec3 DMG2 = vec3(0.545, 0.675, 0.059);',   // #8bac0f
  'const vec3 DMG3 = vec3(0.608, 0.737, 0.059);',   // #9bbc0f
  'float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }',
  'vec3 dmgPalette(float l) {',
  '  float a = smoothstep(0.28, 0.34, l);',
  '  float b = smoothstep(0.52, 0.58, l);',
  '  float c = smoothstep(0.76, 0.82, l);',
  '  vec3 col = mix(DMG0, DMG1, a);',
  '  col = mix(col, DMG2, b);',
  '  col = mix(col, DMG3, c);',
  '  return col;',
  '}',
  'void main() {',
  '  vec2 texel = 1.0 / uTexSize;',
  // Centro exacto del píxel lógico (160x144) para no mezclar vecinos.
  '  vec2 uv = (floor(vUv * uTexSize) + 0.5) * texel;',
  '  float l = luma(texture2D(uTex, uv).rgb);',
  // Sangrado del LCD: los píxeles vecinos iluminan un poco al actual.
  '  float nb = luma(texture2D(uTex, uv + vec2(texel.x, 0.0)).rgb)',
  '           + luma(texture2D(uTex, uv - vec2(texel.x, 0.0)).rgb)',
  '           + luma(texture2D(uTex, uv + vec2(0.0, texel.y)).rgb)',
  '           + luma(texture2D(uTex, uv - vec2(0.0, texel.y)).rgb);',
  '  l = mix(l, nb * 0.25, 0.14);',
  // Rejilla de puntos de la matriz (separación entre celdas).
  '  vec2 cell = fract(vUv * uTexSize);',
  '  vec2 edge = abs(cell - 0.5) * 2.0;',
  '  float m = max(edge.x, edge.y);',
  '  float grid = 1.0 - smoothstep(0.70, 1.0, m) * 0.20;',
  // Viñeta suave y tinte cálido del panel.
  '  vec2 d = vUv - 0.5;',
  '  float vig = 1.0 - dot(d, d) * 0.30;',
  '  vec3 col = dmgPalette(l) * grid * vig;',
  '  col *= vec3(1.02, 1.0, 0.92);',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

function initFX() {
  fxCanvas = $('fx');
  var src = $('lcd');
  if (!fxCanvas || !src) return;
  var gl = null;
  try {
    gl = fxCanvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: false })
      || fxCanvas.getContext('experimental-webgl');
  } catch (e) { gl = null; }
  if (!gl) { fxFailed = true; return; }   // sin WebGL queda el canvas 2D normal

  function compile(type, source) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, source);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.warn('[GB] shader:', gl.getShaderInfoLog(sh));
      return null;
    }
    return sh;
  }
  var vs = compile(gl.VERTEX_SHADER, FX_VERT);
  var fs = compile(gl.FRAGMENT_SHADER, FX_FRAG);
  if (!vs || !fs) { fxFailed = true; return; }
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.warn('[GB] shader link:', gl.getProgramInfoLog(prog));
    fxFailed = true;
    return;
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  fxTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, fxTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.uniform1i(gl.getUniformLocation(prog, 'uTex'), 0);

  fxTexSizeLoc = gl.getUniformLocation(prog, 'uTexSize');
  fxGl = gl;
  fxProgram = prog;
  fxCanvas.parentNode.classList.add('fx-on');
  layoutFX();
  requestAnimationFrame(fxLoop);
}

// El shader dibuja a resolución real del dispositivo, no a 160x144.
function layoutFX() {
  if (!fxCanvas || fxFailed) return;
  if (!fxCanvas.parentNode.classList.contains('fx-on')) return;
  var rect = fxCanvas.parentNode.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var w = Math.round(rect.width * dpr);
  var h = Math.round(rect.height * dpr);
  if (w < 32 || h < 32) return;
  var MAXW = 1440;
  if (w > MAXW) { h = Math.round(h * MAXW / w); w = MAXW; }
  if (fxCanvas.width !== w || fxCanvas.height !== h) {
    fxCanvas.width = w;
    fxCanvas.height = h;
  }
}

function fxLoop() {
  requestAnimationFrame(fxLoop);
  if (!fxGl || fxFailed || document.hidden) return;
  var gl = fxGl, src = $('lcd');
  if (!src || !src.width || !src.height || !fxCanvas.width) return;
  gl.viewport(0, 0, fxCanvas.width, fxCanvas.height);
  gl.useProgram(fxProgram);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fxTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.uniform2f(fxTexSizeLoc, src.width, src.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* =========================================================
   Escalado de la carcasa
   ========================================================= */
function fitShell() {
  var gb = $('gb');
  if (!gb) return;
  // visualViewport refleja el área realmente visible en Android,
  // donde innerHeight incluye la barra de direcciones retraída.
  var vv = window.visualViewport;
  var vw = (vv && vv.width) ? vv.width : window.innerWidth;
  var vh = (vv && vv.height) ? vv.height : window.innerHeight;
  var bar = $('topbar').getBoundingClientRect().height + 4;
  // La carcasa usa todo el ancho de la pantalla; el alto sale de la
  // proporción original 360:610. Solo se reduce si no cabe a lo alto.
  var s = Math.min((vw - 4) / 360, (vh - bar - 4) / 610, 3);
  gb.style.transform = 'scale(' + (s > 0 ? s : 0.2) + ')';
  layoutFX();
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('DOMContentLoaded', function () {
  setupInput();
  initFX();
  fitShell();
  updateRotateGate();
  window.addEventListener('resize', fitShell);
  window.addEventListener('resize', updateRotateGate);
  window.addEventListener('orientationchange', function () { setTimeout(fitShell, 120); setTimeout(updateRotateGate, 120); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitShell);
    window.visualViewport.addEventListener('scroll', fitShell);
  }
  try {
    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', function () { setTimeout(updateRotateGate, 80); });
    }
  } catch (e) {}
  document.addEventListener('fullscreenchange', fitShell);
  document.addEventListener('webkitfullscreenchange', fitShell);

  $('btn-save').addEventListener('click', saveStateNow);
  $('btn-load').addEventListener('click', loadStateNow);
  $('rotate-skip').addEventListener('click', function () {
    // Salida manual: se respeta mientras dure la sesión.
    rotateDismissed = true;
    updateRotateGate();
  });

  /* --- Pantalla completa ---------------------------------------------
     Los navegadores solo la permiten dentro de un gesto del usuario, y los
     visores incrustados (WhatsApp, Instagram, Telegram…) la bloquean del
     todo. Estrategia: se pide en cada gesto sin molestar al jugador y, si
     aun así no entra, aparece un botón de respaldo en la barra. */
  var fsEverEntered = false;
  var fsUserExited = false;

  function fsBind(bind) {
    ['pointerdown', 'pointerup', 'click', 'keydown', 'touchend'].forEach(function (ev) {
      if (bind) document.addEventListener(ev, tryFs, true);
      else document.removeEventListener(ev, tryFs, true);
    });
  }

  function tryFs() {
    if (isInstalledApp() || fsUserExited || isFullscreen()) return;
    // Con el aviso de rotación en pantalla no se secuestra el gesto:
    // pulsar "Continuar en horizontal" no debe forzar la vertical.
    if ($('rotate').classList.contains('show')) return;
    resumeAudio();
    goFullscreen();
    // Si el navegador ignoró la petición, damos una salida manual.
    setTimeout(function () {
      if (!isFullscreen() && !fsUserExited) setFsChip(true);
    }, 700);
  }

  fsBind(true);

  // El clic "limpio" sobre un botón es el gesto que todos aceptan.
  $('btn-fs').addEventListener('click', function () {
    fsUserExited = false;
    goFullscreen();
    setTimeout(function () {
      if (!isFullscreen()) toast('Tu navegador no permite pantalla completa aquí');
    }, 700);
  });

  function onFsChange() {
    if (isFullscreen()) {
      fsEverEntered = true;
      setFsChip(false);
      fsBind(false);
      lockPortrait();
    } else {
      if (fsEverEntered) fsUserExited = true;   // salida voluntaria (Esc o gesto)
      unlockPortrait();
      setFsChip(true);                          // poder volver a entrar
      fsBind(false);
    }
    // El área visible cambia durante/después de la transición
    setTimeout(fitShell, 60);
    setTimeout(fitShell, 400);
    setTimeout(updateRotateGate, 100);
  }

  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  // En una PWA instalada ya se abre a pantalla completa desde el inicio.
  goFullscreen();

  bootGame();
});
</script>
</body>
</html>
